name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Install Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: "1.13.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Run Bats tests
        run: uv run bats --print-output-on-failure tests/esa/zsh.bats tests/moshi/update_moshi_hook.bats tests/codex/update_codex.bats

      - name: Run Python integration tests
        # The installed macOS popup profile is checked locally; static TOML checks run on Linux.
        run: uv run pytest -m integration

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run ruff format
        run: uv run ruff format --check github herdr zsh tests

      - name: Run ruff check
        run: uv run ruff check github herdr zsh tests

      - name: Run ty
        run: uv run ty check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run Python automation tests
        run: uv run pytest -m 'not integration'

  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run deptry
        run: uv run --group audit deptry .

      - name: Run vulture
        run: uv run --group audit vulture

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install shfmt
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64" -o "$RUNNER_TEMP/shfmt"
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $RUNNER_TEMP/shfmt" | sha256sum -c -
          sudo install "$RUNNER_TEMP/shfmt" /usr/local/bin/

      - name: Check tracked Bash scripts
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- '*.sh')
          if ((${#files[@]} == 0)); then
            echo "No tracked Bash scripts found." >&2
            exit 1
          fi
          shellcheck -x --source-path=SCRIPTDIR "${files[@]}"
          shfmt -d "${files[@]}"

  lua-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install selene
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/Kampfkarren/selene/releases/download/0.30.1/selene-0.30.1-linux.zip" -o "$RUNNER_TEMP/selene.zip"
          echo "c8c0f2102cb37e5e3ee2c984b51946b8ea8cf7804b5ea067afdb42fd2b95ff6e  $RUNNER_TEMP/selene.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/selene" /usr/local/bin/

      - name: Run selene
        run: selene --config nvim/selene.toml nvim/

      - name: Install stylua
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.3.1/stylua-linux-x86_64.zip" -o "$RUNNER_TEMP/stylua.zip"
          echo "f0cfea40b3d72223497fa1650061f866e0d19a93a871aae22d3849f1bc9c2722  $RUNNER_TEMP/stylua.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/stylua" /usr/local/bin/

      - name: Run stylua
        run: stylua --check nvim/

  nix-lint:
    uses: furedea/reusable-workflows/.github/workflows/nix-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  nix-check:
    uses: furedea/reusable-workflows/.github/workflows/nix-check.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # nixpkgs revision that provides autocorrect; Renovate updates it.
      NIXPKGS_REV: f9a75f41be3a74eab55d3a7679d34ad6cc0da977
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dprint
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/dprint/dprint/releases/download/0.53.0/dprint-x86_64-unknown-linux-gnu.zip" -o "$RUNNER_TEMP/dprint.zip"
          echo "987185f5f0db6205e5bca88aaab04a7b29bc18bf7a8c1a84f56eef08c9730df0  $RUNNER_TEMP/dprint.zip" | sha256sum -c -
          unzip -o "$RUNNER_TEMP/dprint.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/dprint" /usr/local/bin/

      - name: Run dprint
        run: dprint check --config dprint/dprint.json --incremental=false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Run autocorrect
        run: nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#autocorrect" -- . --lint --no-diff-bg-color

  gha-lint:
    uses: furedea/reusable-workflows/.github/workflows/gha-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      actions: read
      contents: read

  dependency-review:
    uses: furedea/reusable-workflows/.github/workflows/dependency-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  claude-review:
    uses: furedea/reusable-workflows/.github/workflows/claude-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: furedea/reusable-workflows/.github/workflows/codex-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - bats-tests
      - lint-python
      - test-python
      - audit-python
      - shell-lint
      - lua-lint
      - nix-lint
      - nix-check
      - format-check
      - gha-lint
      - dependency-review
      - claude-review
      - codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
