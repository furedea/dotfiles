name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Install Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: "1.13.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Run Bats tests
        run: uv run bats --print-output-on-failure tests/esa/zsh.bats tests/moshi/update_moshi_hook.bats

      - name: Run Python integration tests
        # The installed macOS popup profile is checked locally; static TOML checks run on Linux.
        run: uv run pytest -m integration

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run ruff format
        run: uv run ruff format --check github herdr zsh tests

      - name: Run ruff check
        run: uv run ruff check github herdr zsh tests

      - name: Run ty
        run: uv run ty check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run Python automation tests
        run: uv run pytest -m 'not integration'

  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-python: true

      - name: Run deptry
        run: uv run --group audit deptry .

      - name: Run vulture
        run: uv run --group audit vulture

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: "3.13.1"

      - name: Check tracked Bash scripts
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- '*.sh')
          if ((${#files[@]} == 0)); then
            echo "No tracked Bash scripts found." >&2
            exit 1
          fi
          shellcheck -x --source-path=SCRIPTDIR "${files[@]}"
          shfmt -d "${files[@]}"

  lua-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install selene
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/Kampfkarren/selene/releases/download/0.30.1/selene-0.30.1-linux.zip" -o "$RUNNER_TEMP/selene.zip"
          unzip -o "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/selene" /usr/local/bin/

      - name: Run selene
        run: selene --config nvim/selene.toml nvim/

      - name: Install stylua
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.3.1/stylua-linux-x86_64.zip" -o "$RUNNER_TEMP/stylua.zip"
          unzip -o "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/stylua" /usr/local/bin/

      - name: Run stylua
        run: stylua --check nvim/

  nix-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Run statix
        run: |
          nix run nixpkgs#statix -- check flake.nix
          nix run nixpkgs#statix -- check nix/

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- --fail flake.nix nix/checks.nix nix/darwin/default.nix nix/home/default.nix

      - name: Run nixfmt
        run: nix run nixpkgs#nixfmt -- --check flake.nix nix/checks.nix nix/darwin/default.nix nix/home/default.nix

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dprint
        uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: 0.53.0
          config-path: dprint/dprint.json
          args: --incremental=false

      - name: Run autocorrect
        uses: huacnlee/autocorrect-action@bf91ab3904c2908dd8e71312a8a83ed1eb632997 # v2.13.3
