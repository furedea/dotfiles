name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          rustflags: ""

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14.6"
          enable-cache: true
          cache-python: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: "3.13.1"

      - name: Install Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: "1.13.0"
          support-install: "false"
          assert-install: "false"
          detik-install: "false"
          file-install: "false"

      - name: Install agent test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep shellcheck
          uv tool install --python 3.14.6 ruff==0.16.3
          uv tool dir --bin >> "$GITHUB_PATH"
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install locked agent-harness
        run: |
          agent_harness_rev="$(jq -r '.nodes["agent-harness"].locked.rev' flake.lock)"
          cargo install \
            --git https://github.com/furedea/agent-harness \
            --rev "$agent_harness_rev" \
            --locked \
            --root "$RUNNER_TEMP/agent-harness" \
            agent-harness
          echo "$RUNNER_TEMP/agent-harness/bin" >> "$GITHUB_PATH"

      - name: Run Bats tests
        env:
          AGENT_HARNESS_BIN: agent-harness
          CODEX_BIN: codex
          REQUIRE_CODEX_EXECPOLICY: "1"
        run: bats --print-output-on-failure --recursive tests/github tests/agents

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14.6"
          enable-cache: true
          cache-python: true

      - name: Run ruff format
        run: uv run --python 3.14.6 --frozen ruff format --check agents/skills tests/agents/python

      - name: Run ruff check
        run: uv run --python 3.14.6 --frozen ruff check agents/skills tests/agents/python

      - name: Run ty
        run: uv run --python 3.14.6 --frozen ty check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14.6"
          enable-cache: true
          cache-python: true

      - name: Run Python skill tests
        run: uv run --python 3.14.6 --frozen pytest tests/agents/python

  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14.6"
          enable-cache: true
          cache-python: true

      - name: Run deptry
        run: uv run --python 3.14.6 --group audit deptry .

      - name: Run vulture
        run: uv run --python 3.14.6 --group audit vulture

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=SCRIPTDIR
        with:
          scandir: github
          format: gcc

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Run shfmt
        run: shfmt -d -i 2 -ci github/

  lua-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install selene
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/Kampfkarren/selene/releases/download/0.30.1/selene-0.30.1-linux.zip" -o "$RUNNER_TEMP/selene.zip"
          unzip -o "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/selene" /usr/local/bin/

      - name: Run selene
        run: selene --config nvim/selene.toml nvim/

      - name: Install stylua
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/JohnnyMorganz/StyLua/releases/download/v2.3.1/stylua-linux-x86_64.zip" -o "$RUNNER_TEMP/stylua.zip"
          unzip -o "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/stylua" /usr/local/bin/

      - name: Run stylua
        run: stylua --check nvim/

  nix-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Run statix
        run: |
          nix run nixpkgs#statix -- check flake.nix
          nix run nixpkgs#statix -- check nix/

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- --fail flake.nix nix/darwin/default.nix nix/home/default.nix

      - name: Run nixfmt
        run: nix run nixpkgs#nixfmt-rfc-style -- --check flake.nix nix/darwin/default.nix nix/home/default.nix

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dprint
        uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: 0.53.0
          config-path: dprint/dprint.json
          args: --incremental=false

      - name: Run autocorrect
        uses: huacnlee/autocorrect-action@bf91ab3904c2908dd8e71312a8a83ed1eb632997 # v2.13.3
