name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # bats comes from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Run Bats tests
        # Discovery keeps new files in CI; files tagged macos need a macOS host and are excluded.
        run: uv run bats --recursive --filter-tags '!macos' --print-output-on-failure tests

      - name: Run Python integration tests
        # The installed macOS popup profile is checked locally; static TOML checks run on Linux.
        run: uv run pytest -m integration

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # uv comes from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run ruff format
        run: uv run ruff format --check github herdr zsh tests

      - name: Run ruff check
        run: uv run ruff check github herdr zsh tests

      - name: Run ty
        run: uv run ty check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # uv comes from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run Python automation tests
        run: uv run pytest -m 'not integration'

  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # uv comes from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run deptry
        run: uv run --group audit deptry .

      - name: Run vulture
        run: uv run --group audit vulture

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # Tool versions come from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Check tracked Bash scripts
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- '*.sh')
          if ((${#files[@]} == 0)); then
            echo "No tracked Bash scripts found." >&2
            exit 1
          fi
          shellcheck -x --source-path=SCRIPTDIR "${files[@]}"
          shfmt -d "${files[@]}"

  lua-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # Tool versions come from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run selene
        run: selene --config nvim/selene.toml nvim/

      - name: Run stylua
        run: stylua --check nvim/

  nix-lint:
    uses: furedea/reusable-workflows/.github/workflows/nix-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  nix-check:
    uses: furedea/reusable-workflows/.github/workflows/nix-check.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        # Tool versions come from the flake dev shell, pinned by flake.lock.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: furedea/reusable-workflows/.github/actions/nix-setup@2ae953294b9a805d0705657adc1d9d4f1bc1f646 # v1.3.0

      - name: Run dprint
        run: dprint check --incremental=false

      - name: Run autocorrect
        run: autocorrect . --lint --no-diff-bg-color

  gha-lint:
    uses: furedea/reusable-workflows/.github/workflows/gha-lint.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      actions: read
      contents: read

  dependency-review:
    uses: furedea/reusable-workflows/.github/workflows/dependency-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read

  claude-review:
    uses: furedea/reusable-workflows/.github/workflows/claude-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: furedea/reusable-workflows/.github/workflows/codex-review.yml@ca7c5f2973a899e209bc60767f434aecbc186bc9 # v1.1.0
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - bats-tests
      - lint-python
      - test-python
      - audit-python
      - shell-lint
      - lua-lint
      - nix-lint
      - nix-check
      - format-check
      - gha-lint
      - dependency-review
      - claude-review
      - codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
