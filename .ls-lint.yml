ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|CHANGELOG|AGENTS|CLAUDE|SKILL|SOUL)
  .py: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:__[a-z0-9]+__
  .toml: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:Cargo
  .lock: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:Cargo
  .json: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(package-lock|lazy-lock)
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - "{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - docs/logs
  - "**/docs/logs"

  - "raycast/*.rayconfig"
