model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "guardian_subagent"
# `[permissions.guarded.filesystem]` is appended by `agent-harness
# generate-codex-config-source`. Do not set `default_permissions = "guarded"` by default:
# Codex treats that profile as the full filesystem sandbox policy, so a profile
# containing only harness files prevents even read-only commands from starting.

[sandbox_workspace_write]
network_access = true

# Same Git environment as Claude: no fsmonitor daemon, unsigned agent commits and tags.
[shell_environment_policy.set]
GIT_CONFIG_COUNT = "3"
GIT_CONFIG_KEY_0 = "core.fsmonitor"
GIT_CONFIG_VALUE_0 = "false"
GIT_CONFIG_KEY_1 = "commit.gpgsign"
GIT_CONFIG_VALUE_1 = "false"
GIT_CONFIG_KEY_2 = "tag.gpgsign"
GIT_CONFIG_VALUE_2 = "false"

[notice]
fast_default_opt_out = true
hide_rate_limit_model_nudge = true

[tui]
use_theme_colors = true
vim_mode_default = true
status_line = [
  "project-root",
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"

[plugins."browser-use@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false

[features]
hooks = true
external_migration = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 120000
default_wait_timeout_ms = 120000
