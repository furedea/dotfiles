model = "gpt-6-astra"
model_reasoning_effort = "max"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "read-only"
approvals_reviewer = "guardian_subagent"
# `[permissions.guarded.filesystem]` is appended by `agent-harness
# generate-codex-config-source`. Do not set `default_permissions = "guarded"` by default:
# Codex treats that profile as the full filesystem sandbox policy, so a profile
# containing only harness files prevents even read-only commands from starting.

[notice]
fast_default_opt_out = true
hide_rate_limit_model_nudge = true

[tui]
use_theme_colors = true
vim_mode_default = true
status_line = [
  "project-root",
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"

[plugins."browser-use@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false

[features]
hooks = true
