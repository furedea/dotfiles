onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
new_workspace = "prefix+ctrl+n"
new_worktree = "prefix+ctrl+w"
close_workspace = "prefix+ctrl+d"
switch_workspace = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "/etc/profiles/per-user/kaito/bin/yazi"
description = "run yazi"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "/etc/profiles/per-user/kaito/bin/lazygit"
description = "run lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "exec zsh"
description = "open scratch terminal"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[ui]
agent_panel_sort = "spaces"
