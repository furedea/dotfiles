onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+a"
new_workspace = "prefix+ctrl+n"
new_worktree = "prefix+ctrl+w"
close_workspace = "prefix+ctrl+d"
switch_workspace = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "/etc/profiles/per-user/kaito/bin/yazi"
description = "run yazi"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "/etc/profiles/per-user/kaito/bin/lazygit"
description = "run lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "exec zsh"
description = "open scratch terminal"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = '''
BASH_XTRACEFD=9 \
  GH_BIN="/etc/profiles/per-user/kaito/bin/gh" \
  GIT_BIN="/etc/profiles/per-user/kaito/bin/git" \
  exec "$HOME/.local/libexec/herdr_merge_pull_request.sh" \
    "${HERDR_ACTIVE_PANE_CWD:-$PWD}" 9>/dev/null
'''
description = "squash-merge current PR"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+e"
type = "shell"
command = "HERDR_PANE_ID=\"$HERDR_ACTIVE_PANE_ID\" HERDR_TAB_ID=\"$HERDR_ACTIVE_TAB_ID\" /etc/profiles/per-user/kaito/bin/terminal-browser --split right"
description = "open terminal browser"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[experimental]
kitty_graphics = true
