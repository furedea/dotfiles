commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}

# pre-commit owns whole-project format check and lint. Test execution is
# delegated to CI and the agent hooks installed by Home Manager.
pre-commit:
  parallel: true
  commands:
    # ----- format check -----
    shfmt:
      glob: "*.sh"
      run: shfmt -d {all_files}
    nixfmt:
      glob: "*.nix"
      run: bash -c 'mapfile -t files < <(git ls-files "*.nix"); ((${#files[@]} == 0)) || nixfmt --check "${files[@]}"'
    stylua:
      glob: "*.lua"
      run: stylua --check {all_files}
    autocorrect:
      glob: "*.{md,txt}"
      run: autocorrect --lint {all_files}
    dprint:
      glob: "*.{json,toml}"
      run: dprint check --config ~/dprint.json {all_files}
    # ----- lint -----
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x --source-path=SCRIPTDIR {all_files}
    statix:
      glob: "*.nix"
      run: statix check .
    deadnix:
      glob: "*.nix"
      run: deadnix --fail .
    actionlint:
      glob: "{.github/workflows,templates}/*.yml"
      run: actionlint {all_files}
    ruff-format:
      glob: "*.py"
      run: uv run --frozen ruff format --check github herdr zsh tests
    ruff-check:
      glob: "*.py"
      run: uv run --frozen ruff check github herdr zsh tests
    ty:
      glob: "*.py"
      run: uv run --frozen ty check
    ls-lint:
      run: ls_lint
    # Same 500-line budget as template-python, applied to hand-written code.
    # Nix modules, data files, and docs are excluded.
    file-length:
      glob: "*.{py,sh,bash,bats,zsh,lua}"
      run: |
        for f in {staged_files}; do
          n=$(wc -l < "$f")
          [ "$n" -le 500 ] || { echo "$f: $n lines (max 500)"; fail=1; }
        done
        exit ${fail:-0}
