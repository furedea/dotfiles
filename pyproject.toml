[project]
name = "dotfiles"
version = "0.1.0"
description = "Standard-library automation and tests for personal dotfiles."
requires-python = ">= 3.15.2, < 3.16"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-n", "auto"]
markers = ["integration: requires the installed macOS Home Manager profile or Nix-built packages"]

[tool.deptry]
ignore_notebooks = true

[tool.vulture]
paths = ["github", "herdr", "zsh", "tests"]
min_confidence = 100
sort_by_size = true
exclude = [".venv", "build", "dist"]

[tool.uv]
managed = true
default-groups = ["lint", "typecheck", "test"]
exclude-newer = "1 week"

[dependency-groups]
lint = [
  "ruff==0.17.3",
]
typecheck = [
  "ty==0.0.95",
]
test = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest-xdist==3.8.0",
]
audit = [
  "deptry==0.25.1",
  "vulture==2.16",
]

[tool.ruff]
target-version = "py315"
src = ["github", "herdr", "zsh", "tests"]
line-length = 119

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "AIR",
  "FAST",
  "YTT",
  "ANN",
  "ASYNC",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "FIX",
  "FA",
  "INT",
  "LOG",
  "G",
  "PIE",
  "PYI",
  "Q",
  "SLOT",
  "TID",
  "TD",
  "ARG",
  "PTH",
  "FLY",
  "I",
  "NPY",
  "PD",
  "PERF",
  "E",
  "W",
  "D",
  "DOC",
  "N",
  "F",
  "PGH",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "UP",
  "FURB",
  "RUF",
  "INP",
  "C901",
  "PLR1702",
]
ignore = [
  "G004",
  "PLC1901",
  "PLR2004",
  "ANN401",
  "ARG002",
  "INP001",
  "B008",
  "A002",
  "A003",
  "D104",
  "D105",
  "D107",
  "W191",
  "E111",
  "E114",
  "E117",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913", "PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3
max-nested-blocks = 2

[tool.ty.src]
include = ["github", "herdr", "zsh", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
deprecated = "warn"

invalid-argument-type = "error"
invalid-assignment = "error"
invalid-attribute-access = "error"
invalid-method-override = "error"
invalid-parameter-default = "error"
invalid-return-type = "error"
invalid-type-arguments = "error"

missing-argument = "error"
no-matching-overload = "error"
not-subscriptable = "error"

unresolved-attribute = "error"
unresolved-import = "error"
unresolved-reference = "error"

possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
redundant-cast = "warn"
unknown-argument = "warn"
unused-type-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = false
