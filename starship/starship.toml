"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 5000
format = """$username\
$hostname\
$directory\
$git_branch\
$git_status\
$container\
$nix_shell\
$python\
$rust\
$nodejs\
$bun\
$deno\
$docker_context\
$all\
$character"""

[character]
success_symbol = "[\\$](green bold)"
error_symbol = "[\\$](red bold)"

[cmd_duration]
min_time = 3000

[directory]
truncation_length = 1

[git_branch]
format = "[$branch(:$remote_branch)]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

# --- Modules (alphabetical) ---

[aws]
format = '[$symbol($profile)(\($region\))(\[$duration\])]($style) '

[azure]
format = '[$symbol($subscription)]($style) '

[buf]
format = '[$symbol]($style)'

[bun]
format = '[$symbol]($style)'

[c]
format = '[$symbol]($style)'

[cmake]
format = '[$symbol]($style)'

[cobol]
